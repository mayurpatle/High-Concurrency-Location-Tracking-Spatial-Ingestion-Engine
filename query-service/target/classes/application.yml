server:
  port: 8083

spring:
  application:
    name: query-service
  data:
    redis:
      host: localhost
      port: 6379
  cassandra:
    contact-points: localhost
    port: 9042
    local-datacenter: datacenter1
    schema-action: none

# no kafka block — query never touches the bus
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always