server:
  port: 8082

spring:
  application:
    name: processing-service
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379
  cassandra:
    contact-points: localhost
    port: 9042
    local-datacenter: datacenter1   # MUST match CASSANDRA_DC from Part 3, or startup fails
    schema-action: none             # don't create/validate schema at boot — Phase 4 owns that

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always