server:
  port: 8082

spring:
  application:
    name: processing-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # THE group id. All instances sharing this string form one group, and
      # Kafka divides the 12 partitions among them. Change it and you get a
      # SECOND independent group that re-reads the whole topic from scratch —
      # a genuinely useful trick for backfills, and a nasty surprise if done
      # by accident (e.g. a typo in a deploy config).
      group-id: geopulse-location-processor

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      # Where to start when a group has NO committed offset (brand new group,
      # or offsets expired). Options: earliest | latest | none.
      #
      # We use `earliest` in dev so a fresh consumer drains the messages we
      # already produced in Phase 1 — otherwise you'd start a consumer, see
      # nothing happen, and wonder what broke.
      #
      # PRODUCTION would arguably use `latest`: on a brand-new group you rarely
      # want to replay hours of stale location data — a 2-hour-old position is
      # worse than useless, it's WRONG. Note this setting only applies when
      # there's no committed offset; it does NOT mean "skip messages on restart."
      auto-offset-reset: earliest

      # Turn OFF auto-commit. With it on, Kafka commits offsets on a timer,
      # INDEPENDENTLY of whether we processed anything — so a crash between a
      # timer commit and the actual write silently LOSES messages.
      # We want commits tied to processing completion. See ack-mode below.
      enable-auto-commit: false

      # How many records one poll() returns. See the poll-deadline math below.
      max-poll-records: 500

      properties:
        # ---- The rebalance-storm guard ----
        # If we don't call poll() again within this window, Kafka declares us
        # dead and reassigns our partitions. The arithmetic that must hold:
        #   max-poll-records × per-record time  <<  max.poll.interval.ms
        #   500 × ~5ms = 2.5s   vs   300,000ms   → enormous margin, deliberately.
        max.poll.interval.ms: 300000

        # Heartbeats run on a BACKGROUND thread and prove liveness. This is
        # SEPARATE from the poll deadline: heartbeats say "the process is alive",
        # poll interval says "the process is making progress." A consumer stuck
        # in a slow write keeps heartbeating while failing to poll — which is
        # exactly why both checks exist.
        session.timeout.ms: 45000
        heartbeat.interval.ms: 3000

        # Tell the deserializer what type to build. Required because we turned
        # OFF type headers on the producer side (Session 1.3) — the message is
        # plain JSON with no embedded Java class name, by design.
        spring.json.value.default.type: com.geopulse.common.model.LocationPing
        spring.json.trusted.packages: com.geopulse.common.model
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

      listener:
        # Commit offsets after the listener returns for a batch of records.
        # Since our listener only returns after the write succeeds, this gives us
        # AT-LEAST-ONCE semantics — the choice from Part 1.
        ack-mode: batch

        # Consumer threads in THIS instance, each taking distinct partitions.
        # 3 instances × concurrency 4 = 12 threads for 12 partitions = one each.
        concurrency: 4
  data:
    redis:
      host: localhost
      port: 6379
  cassandra:
    contact-points: localhost
    port: 9042
    local-datacenter: datacenter1   # MUST match CASSANDRA_DC from Part 3, or startup fails
    schema-action: none             # don't create/validate schema at boot — Phase 4 owns that

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

geopulse:
  kafka:
    topic: driver-location-pings